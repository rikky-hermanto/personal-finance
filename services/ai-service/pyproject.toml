[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.11.9"
dependencies = [
    "google-genai>=0.1.0",
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.20",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "langfuse>=3.0,<4.0",
    "openai>=1.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "flashrank>=0.2",
    "sse-starlette>=2.1",
]


[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "anyio>=4.8.0",
    # Pinned to the 0.2 line with an upper bound: unbounded ">=0.2" resolves to
    # ragas 0.4.x + langchain 1.x, which are mutually incompatible (ragas 0.4.3
    # imports ChatVertexAI from a langchain_community path deleted in langchain 1.x).
    "ragas>=0.2,<0.3",
    "langchain-openai>=0.2,<0.3",   # RAGAS judge LLM wrapper — eval-only, never app code
    "langchain-community>=0.3,<0.4",  # transitive pin — keeps the ragas import path valid
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
