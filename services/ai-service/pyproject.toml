[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-service"
version = "0.1.0"
requires-python = ">=3.11.9"
dependencies = [
    "google-genai>=0.1.0",
    "anthropic>=0.49.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "pymupdf>=1.25.0",
    "python-multipart>=0.0.20",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "langfuse>=3.0,<4.0",
    "openai>=1.30",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "flashrank>=0.2",
    "sse-starlette>=2.1",
    "smolagents[litellm]>=1.9",
    "litellm>=1.50",
    # Upper-bounded below 1.0: unbounded ">=0.2" resolves to langgraph 1.x, which
    # requires langchain-core>=1.4.7 — that upgrade cascades and breaks the pinned
    # ragas/langchain-openai/langchain-community stack below (same class of issue
    # as the ragas pin's comment). langgraph 0.6.11 is the last pre-1.0 release and
    # resolves against the langchain-core 0.3.x line already required here.
    "langgraph>=0.2,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "httpx>=0.27",
]


[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "anyio>=4.8.0",
    # Pinned to the 0.2 line with an upper bound: unbounded ">=0.2" resolves to
    # ragas 0.4.x + langchain 1.x, which are mutually incompatible (ragas 0.4.3
    # imports ChatVertexAI from a langchain_community path deleted in langchain 1.x).
    "ragas>=0.2,<0.3",
    "langchain-openai>=0.2,<0.3",   # RAGAS judge LLM wrapper — eval-only, never app code
    "langchain-community>=0.3,<0.4",  # transitive pin — keeps the ragas import path valid
    # PF-AI008 ACT: declared for Gemini/LangChain parity, not imported by any code —
    # the advisor uses ChatAnthropic only (see financial_advisor.py). Same upper-bound
    # reasoning as langgraph above: unbounded ">=2.0" resolves to 4.x, which requires
    # langchain-core>=1.6.0 and re-breaks the pinned ragas stack. 2.1.12 is the last
    # 2.x release and resolves against langchain-core 0.3.x untouched.
    "langchain-google-genai>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
