name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (dotnet build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore PersonalFinance.slnx
      - run: dotnet build PersonalFinance.slnx --no-restore
      - run: dotnet test PersonalFinance.slnx --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory TestResults/coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-dotnet
          path: apps/api/TestResults/coverage
          if-no-files-found: ignore

  frontend:
    name: frontend (lint + tsc + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx --no-install tsc --noEmit -p tsconfig.app.json
      - run: npx --no-install tsc --noEmit -p tsconfig.node.json
      # Runs every src/lib suite once (the per-area test:* scripts remain for local use) with coverage.
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: apps/frontend/coverage/coverage-final.json
          if-no-files-found: ignore
      - run: npm run build

  ai-service:
    name: ai-service (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt
      # PF-157: test against the versions that ship. The lock first, then the dev extras on top.
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --cov --cov-report=term --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-python
          path: services/ai-service/coverage.json
          if-no-files-found: ignore

  # Combines the three coverage files into the same report `npm run coverage` writes locally and
  # shows it on the run's summary page. Informational only: there is no coverage threshold.
  coverage:
    name: coverage report
    needs: [api, frontend, ai-service]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: coverage-dotnet
          path: apps/api/TestResults/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: apps/frontend/coverage
      - uses: actions/download-artifact@v4
        with:
          name: coverage-python
          path: services/ai-service
      - run: node scripts/coverage-report.mjs --no-run
      - run: cat docs/records/coverage/README.md >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
