# Auto deploy Bundle A after every green CI run on main.
# Order: Supabase migrations, then AI service, then API, then frontend.
# Setup and first manual deploy: docs/ideas/deployment-bundle-a-runbook.md (Langkah 15).
#
# Cloud Run services must already exist with their env vars and secrets (runbook Langkah 7-8).
# This workflow only swaps the container image; `gcloud run deploy --image` keeps the rest
# of the revision config. A service is rebuilt only when its folder changed since the commit
# its running image was built from.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and deploy every service even if its folder did not change
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write   # Workload Identity Federation to GCP, no JSON key

# One deploy at a time, and never cancel one halfway through a migration or rollout.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/pf

jobs:
  plan:
    name: plan (what changed since the running images)
    # DEPLOY_ENABLED is a repository variable, so this file is safe to merge before GCP exists.
    if: >-
      vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      ai: ${{ steps.diff.outputs.ai }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: diff
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          needs_deploy() {
            local service="$1" path="$2" image deployed
            if ! image=$(gcloud run services describe "$service" --region "$REGION" \
                  --format='value(spec.template.spec.containers[0].image)'); then
              echo "::error::Cloud Run service $service not found. Do its first deploy by hand (runbook Langkah 7-8)." >&2
              exit 1
            fi
            deployed="${image##*:}"
            if [[ "$FORCE" == "true" ]] || ! git cat-file -e "${deployed}^{commit}" 2>/dev/null; then
              echo true
            elif git diff --quiet "$deployed" "$SHA" -- "$path"; then
              echo false
            else
              echo true
            fi
          }
          ai=$(needs_deploy pf-ai services/ai-service)
          api=$(needs_deploy pf-api apps/api)
          echo "ai=$ai" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Deploy plan for $SHA: ai-service=$ai, api=$api, frontend=true" >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: migrate (supabase db push)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # No-op when nothing is pending. Fails if the Free project is paused (7 days idle):
      # resume it in the Supabase dashboard and re-run this workflow.
      - run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  deploy-ai:
    name: deploy ai-service
    needs: [plan, migrate]
    if: needs.plan.outputs.ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/ai-service
          push: true
          tags: ${{ env.REGISTRY }}/ai-service:${{ env.SHA }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service
      - run: |
          gcloud run deploy pf-ai --region "$REGION" \
            --image "$REGISTRY/ai-service:$SHA" --quiet
      - name: smoke test
        run: |
          url=$(gcloud run services describe pf-ai --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/health"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$url/mcp/")
          if [[ "$code" != "404" ]]; then echo "::error::/mcp answered $code, expected 404"; exit 1; fi

  deploy-api:
    name: deploy api
    needs: [plan, migrate, deploy-ai]
    # Waits for the AI service so a new API never calls an AI route that is not live yet.
    if: >-
      !cancelled() && needs.plan.outputs.api == 'true' && needs.migrate.result == 'success' &&
      (needs.deploy-ai.result == 'success' || needs.deploy-ai.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ env.REGISTRY }}/api:${{ env.SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - run: |
          gcloud run deploy pf-api --region "$REGION" \
            --image "$REGISTRY/api:$SHA" --quiet
      - name: smoke test
        run: |
          url=$(gcloud run services describe pf-api --region "$REGION" --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/health/live"

  deploy-frontend:
    name: deploy frontend (vercel)
    needs: [plan, migrate, deploy-ai, deploy-api]
    if: >-
      !cancelled() && needs.migrate.result == 'success' &&
      (needs.deploy-ai.result == 'success' || needs.deploy-ai.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global vercel@latest
      # The Vercel project's Root Directory (apps/frontend) and its Production env vars
      # (VITE_*) come from `vercel pull`, so nothing frontend-specific is configured here.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
