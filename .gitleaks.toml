# Extends the default gitleaks rules. Gitleaks scans every commit's diff, so an inline
# `gitleaks:allow` added in a later commit cannot clear a finding in an earlier one;
# this config applies to the whole scanned range.
[extend]
useDefault = true

[allowlist]
description = "Fake secrets used only as test fixtures, and the public local-Supabase defaults"
paths = [
  '''apps/api/tests/PersonalFinance\.Tests/Infrastructure/AiChatClientTests\.cs''',
  '''services/ai-service/tests/test_owner_scope\.py''',
  '''services/ai-service/tests/test_advisor_tools\.py''',
]
regexes = [
  '''pf-s15-fixture-secret''',
  '''postgresql://postgres:postgres@127\.0\.0\.1:54322/postgres''',  # commit-skill:allow (public Supabase CLI default)
  # Supabase CLI demo keys: the JWT payload starts {"iss":"supabase-demo", and every local
  # install ships the same pair. A real project key carries "iss":"supabase" and is still flagged.
  '''eyJpc3MiOiJzdXBhYmFzZS1kZW1vIi''',
  # An env var name, not a value (scripts/pf_s08_session_expiry.py).
  '''^PF_S08_JWT_EXPIRY_SECONDS$''',
]
