<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PF-AI008 Quiz</title>
<style>
:root{color-scheme:dark;--bg:#1d1d1f;--panel:#111113;--border:#353538;--text:#ececef;--muted:#aaaab4;--purple:#8985ff;--blue:#247cba;--green:#44c79a;--red:#e08188}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;border:1px solid transparent;border-radius:5px;cursor:pointer;padding:9px 19px;line-height:1.5;font-weight:600}
button:disabled{opacity:.42;cursor:default}
button:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
a{color:var(--purple);text-underline-offset:4px}
code{font-family:"Cascadia Code",Consolas,monospace;font-size:.86em;background:#242426;border:1px solid #444448;border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
h1,h2,h3,p{margin-top:0}
.app{max-width:820px;margin:auto;padding:24px 16px 32px;display:flex;flex-direction:column;gap:20px;min-height:100dvh}
.masthead{padding:20px 22px 22px;background:var(--panel);border:1px solid #29292d;border-radius:8px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.crumb a{color:var(--muted)}
.topline{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{margin:0;color:var(--purple);font-size:22px;line-height:1.35}
.count{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
progress{display:block;width:100%;height:8px;appearance:none;border:0;border-radius:20px;overflow:hidden;background:#3a3a3f}
progress::-webkit-progress-bar{background:#3a3a3f}
progress::-webkit-progress-value{background:var(--green);transition:width .2s}
progress::-moz-progress-bar{background:var(--green)}
.quiz{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:28px clamp(18px,4vw,38px)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.plain{color:var(--muted);background:transparent;border-color:#424247;font-size:12px;padding:5px 10px}
.qcount{margin-bottom:4px;font-size:12px;color:var(--purple);font-weight:600;letter-spacing:.06em}
.certs{font-size:12px;color:var(--muted);margin-bottom:16px}
.scenario{padding:13px 16px;background:#202023;border-left:3px solid var(--purple);border-radius:0 5px 5px 0;margin:0 0 18px;font-size:15px;color:#d6d6dc}
.scenario b{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.prompt{font-size:18px;font-weight:500;margin-bottom:18px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#18181b;color:var(--text);border:1px solid #33333a;border-radius:7px;padding:12px 14px;font-weight:400}
.option:not(:disabled):hover{background:#202028;border-color:#5b5795;filter:none}
.option:disabled{opacity:1;cursor:default}
.option .letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2c2c33;font-weight:700;font-size:13px}
.option .txt{flex:1;min-width:0}
.option.correct{background:#162b24;border-color:#3d9c7b}
.option.correct .letter{background:var(--green);color:#092219}
.option.wrong{background:#302022;border-color:#a66470}
.option.wrong .letter{background:var(--red);color:#2a0d10}
.option.dim{opacity:.55}
.mark{display:block;font-size:12px;font-weight:600;margin-top:3px;color:#72e2b9}
.wrong .mark{color:#ffc0c5}
.hint{color:var(--muted);font-size:12px;margin:14px 0 0}
.feedback{background:#e9f8f1;color:#176a52;border-left:4px solid var(--green);padding:15px 18px;border-radius:3px;margin:18px 0 20px;font-size:15px}
.feedback.incorrect{background:#fff0ee;color:#863a42;border-left-color:var(--red)}
.feedback h3{font-size:15px;margin:0 0 6px}
.feedback p{margin:0 0 8px}.feedback p:last-child{margin:0}
.feedback .maps{font-size:12px;opacity:.85}
.feedback code{color:inherit;background:#ffffff80;border-color:#00000020}
.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.primary{background:var(--green);color:#092219}
.secondary{background:#29292e;color:var(--text);border-color:#51515a}
.score{color:var(--muted);font-size:12px;margin-top:20px}
.big{font-size:56px;line-height:1.2;letter-spacing:-.04em;color:var(--green);font-weight:700;margin:12px 0}
.review{border-top:1px solid var(--border);padding:14px 0}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:14px}
.review .st{color:var(--green);font-weight:650;font-size:12px;flex:none}
.review .st.missed{color:#efa4ac}
.review p{font-size:14px;margin:10px 0 0}
.foot{color:#91919d;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:#aaa7e9}
.topics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.topics a{display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px 18px;text-decoration:none;color:var(--text)}
.topics a:hover{border-color:#5b5795}
.topics .id{color:var(--purple);font-weight:650;font-size:13px;margin-right:8px}
.topics .meta{color:var(--muted);font-size:12px;flex:none}
.lede{color:var(--muted);font-size:14px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="crumb"><a href="index.html">AI Learning quizzes</a> · PF-AI008</div>
    <div class="topline"><h1>LangGraph: Stateful Financial Health Advisor</h1><span class="count" id="count"></span></div>
    <progress id="progress" value="0" max="1" aria-label="Questions answered"></progress>
  </header>
  <main class="quiz" id="panel">
    <div class="toolbar"><span class="eyebrow" id="round">Knowledge check</span><button class="plain" id="restart" type="button">Restart</button></div>
    <div id="content"></div>
    <noscript><p>Enable JavaScript to take this quiz.</p></noscript>
  </main>
  <footer class="foot"><span>Source: <a href="../../../plans/done/learning/PF-AI008-langgraph-financial-advisor.md">PF-AI008-langgraph-financial-advisor.md</a></span><span>Keys: A–D answer · → next · ← previous</span></footer>
</div>
<script type="application/json" id="data">[{"id": "q1", "number": 1, "title": "StateGraph vs sequential pipeline", "certs": "Databricks · Google Cloud PMLE", "scenario": "A colleague suggests implementing the Financial Health Advisor as a simple function: fetch all four data sources, concatenate them, call the LLM once with the full context.", "prompt": "What does a LangGraph <code>StateGraph<\/code> give you that the single-function approach does NOT?", "options": [{"id": "A", "html": "The graph allows the LLM to decide <em>which<\/em> tools to call and <em>in what order<\/em>, observe the results, and reason again — enabling conditional, multi-hop behavior that a fixed pipeline can't express"}, {"id": "B", "html": "The graph parallelises all tool calls automatically, halving latency"}, {"id": "C", "html": "The graph validates tool return types against the state schema at compile time"}, {"id": "D", "html": "The graph automatically caches LLM responses across requests, so repeated queries are free"}], "answer": "A", "explanation": "The ReAct loop (Reason → Act → Observe → Reason) is the key upgrade. A single-function pipeline fetches everything regardless of whether it's needed; the graph lets the LLM call only the tools it needs, in the order it needs them, then synthesise over the actual results. B is wrong (ToolNode dispatches calls serially by default); C and D are not LangGraph features.", "maps": "Databricks GenAI Engineer Associate · Application Development (agentic systems); Google Cloud PMLE · MLOps / production AI systems"}, {"id": "q2", "number": 2, "title": "The <code>add_messages<\/code> reducer", "certs": "Databricks · AWS ML Engineer", "scenario": "You define <code>messages: list[BaseMessage]<\/code> in your TypedDict state (without <code>Annotated[list, add_messages]<\/code>). On the second turn, the user's message is missing from the LLM's context.", "prompt": "What caused this, and how does <code>add_messages<\/code> fix it?", "options": [{"id": "A", "html": "<code>list[BaseMessage]<\/code> is not serialisable; <code>add_messages<\/code> converts it to JSON for the checkpointer"}, {"id": "B", "html": "Without <code>add_messages<\/code>, LangGraph limits message history to one turn to save memory"}, {"id": "C", "html": "LangGraph state updates replace field values by default. Without a reducer, each node's returned <code>{&quot;messages&quot;: [...]}<\/code> overwrites the previous list. <code>add_messages<\/code> is a reducer that <em>appends<\/em> instead of replacing — it merges the new messages onto the existing list."}, {"id": "D", "html": "<code>add_messages<\/code> deduplicates messages so the LLM never sees the same message twice"}], "answer": "C", "explanation": "LangGraph's default state update is a merge of dicts, but for list fields, the incoming value <em>replaces<\/em> the previous value unless a reducer is specified. <code>add_messages<\/code> is the canonical reducer for conversation history: it appends incoming messages to the accumulator. This is the non-obvious TypedDict gotcha that causes silent history loss.", "maps": "Databricks GenAI Engineer Associate · Application Development (stateful agents); AWS Certified ML Engineer – Associate · Model deployment"}, {"id": "q3", "number": 3, "title": "Conditional routing", "certs": "Azure AI-102 · Databricks", "scenario": "Your <code>should_continue<\/code> function receives a state where the agent node set <code>error: &quot;httpx.ConnectError: .NET API unreachable&quot;<\/code> instead of making tool calls.", "prompt": "What is the correct routing outcome, and why is routing through the graph preferable to catching the exception in the agent node?", "options": [{"id": "A", "html": "Route to <code>END<\/code> immediately; the graph cannot recover from a network error at runtime"}, {"id": "B", "html": "Re-route to the agent node to retry; LangGraph automatically retries tool failures"}, {"id": "C", "html": "Route to <code>&quot;tools&quot;<\/code> to trigger tool re-execution with a different provider"}, {"id": "D", "html": "Route to <code>&quot;fallback&quot;<\/code> — because the error field is set, <code>should_continue<\/code> returns <code>&quot;fallback&quot;<\/code> regardless of tool_calls; the fallback node returns a graceful user-facing message. Graph-level routing is preferable because it makes the error path an explicit, testable, inspectable graph edge — not an implicit try/catch that swallows failures silently."}], "answer": "D", "explanation": "<code>should_continue<\/code> checks <code>state.get(&quot;error&quot;)<\/code> before checking <code>tool_calls<\/code>, so any node that sets an error signal routes to <code>&quot;fallback&quot;<\/code>. The graph advantage over try/catch: the fallback path appears in the graph topology, can be unit-tested with a state fixture, and shows up in Langfuse as a named node — not as a stack trace buried in logs.", "maps": "Azure AI-102 · Responsible AI / error handling; Databricks GenAI Engineer Associate · Application Development (reliability)"}, {"id": "q4", "number": 4, "title": "MemorySaver and session identity", "certs": "Databricks · AWS ML Engineer", "scenario": "", "prompt": "Two users call <code>POST /advisor<\/code> in the same second. Both requests omit <code>session_id<\/code>. What determines whether they share conversation memory?", "options": [{"id": "A", "html": "They share memory because MemorySaver is process-scoped and not tenant-aware"}, {"id": "B", "html": "They each get a fresh <code>uuid4()<\/code> session_id assigned by <code>AdvisorService.ask()<\/code>; MemorySaver uses <code>thread_id<\/code> as the isolation key. Different thread_ids = independent memory threads."}, {"id": "C", "html": "LangGraph automatically namespaces MemorySaver by request timestamp"}, {"id": "D", "html": "They share memory for the duration of the current event loop tick, then diverge"}], "answer": "B", "explanation": "<code>AdvisorService.ask()<\/code> generates a <code>uuid4()<\/code> when <code>session_id<\/code> is None, then maps it to <code>thread_id<\/code> in the LangGraph config. MemorySaver isolates state by <code>thread_id<\/code> — two different UUIDs are two independent conversation threads even in the same process. A is technically true (MemorySaver is process-scoped) but wrong about the isolation: thread_id is the isolation key, not process scope.", "maps": "Databricks GenAI Engineer Associate · Application Development (multi-user agents); AWS Certified ML Engineer – Associate · Model serving"}, {"id": "q5", "number": 5, "title": "Tool docstrings as prompt", "certs": "Databricks · Google Cloud PMLE", "scenario": "The agent never calls <code>get_investment_summary<\/code> even when the user asks about their portfolio. You notice the <code>@tool<\/code> function has a one-line docstring: <code>&quot;&quot;&quot;Get investments.&quot;&quot;&quot;<\/code>", "prompt": "What is the most likely root cause?", "options": [{"id": "A", "html": "The LLM uses the tool's docstring as its description to decide <em>when<\/em> to call it. A vague docstring — <code>&quot;&quot;&quot;Get investments.&quot;&quot;&quot;<\/code> — gives the model no signal about what data the tool returns or when it's relevant. A specific docstring that mentions return fields and use-case triggers correct tool selection."}, {"id": "B", "html": "<code>@tool<\/code> decorated functions must have <code>async def<\/code> signatures to work with LangGraph"}, {"id": "C", "html": "The tool is not in the <code>TOOLS<\/code> list passed to the selected chat model's <code>.bind_tools()<\/code>"}, {"id": "D", "html": "Investment tools require a <code>portfolio_id<\/code> parameter; without it, LangGraph silently skips the tool"}], "answer": "A", "explanation": "Tool docstrings ARE the tool description injected into the LLM's system context. The LLM selects tools based on how well their description matches the user's intent. Vague descriptions = tool never called. The fix is a docstring that names the return fields and when to use the tool — exactly as <code>get_investment_summary<\/code> is written in Step 4. C would also prevent it being called, but the scenario says it's in the list.", "maps": "Databricks GenAI Engineer Associate · Application Development (tool design); Google Cloud PMLE · Prompt engineering"}, {"id": "q6", "number": 6, "title": "ReAct loop structure", "certs": "Databricks · Azure AI-102", "scenario": "After <code>ToolNode<\/code> returns a <code>ToolMessage<\/code> containing the pyramid scores, the next edge in your graph goes directly to <code>END<\/code>. The agent's final answer says \"I don't have access to your financial data.\"", "prompt": "What structural mistake caused this, and what is the fix?", "options": [{"id": "A", "html": "<code>ToolMessage<\/code> is not a valid state message type; replace it with <code>HumanMessage<\/code>"}, {"id": "B", "html": "The tool returned scores in the wrong format; fix the JSON schema"}, {"id": "C", "html": "MemorySaver was not initialised with the correct <code>thread_id<\/code>, so the tool result was stored in a different session"}, {"id": "D", "html": "The edge <code>tools → END<\/code> skips the re-reasoning step. After ToolNode appends the tool result, the agent needs to <em>reason again<\/em> over that result to produce an answer. The fix: add an edge <code>tools → agent<\/code> so the LLM sees the tool results and synthesises an answer."}], "answer": "D", "explanation": "The ReAct loop is: Reason → Act → <strong>Observe → Reason again<\/strong>. <code>tools → END<\/code> cuts the loop after \"Act\" — the LLM never sees the tool results. The <code>tools → agent<\/code> edge is mandatory; it's what makes the result <em>observable<\/em> and closes the ReAct cycle. The agent then produces its final answer in the next <code>agent<\/code> node invocation, which returns no tool_calls, and <code>should_continue<\/code> routes to END.", "maps": "Databricks GenAI Engineer Associate · Application Development (agentic loop design); Azure AI-102 · Implement AI agents"}]</script>
<script>
(() => {
  const Q = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const content = $('content');
  let ids, index, answers, done, review;

  function start(sel, isReview) { ids = sel; index = 0; answers = {}; done = false; review = isReview; render('prompt'); }
  const byId = id => Q.find(q => q.id === id);
  const stats = () => {
    const answered = ids.filter(id => id in answers);
    const missed = answered.filter(id => answers[id] !== byId(id).answer);
    return { answered: answered.length, correct: answered.length - missed.length, total: ids.length, missed };
  };

  function render(focusId) {
    const s = stats();
    $('count').textContent = s.answered + ' / ' + s.total + (review ? ' reviewed' : ' answered');
    $('progress').max = s.total; $('progress').value = s.answered;
    $('round').textContent = review ? 'Review round · missed questions' : 'Knowledge check · ' + Q.length + ' questions';
    done ? renderResults(s) : renderQuestion(s);
    const el = focusId && $(focusId); if (el) el.focus({ preventScroll: true });
  }

  function renderQuestion(s) {
    const q = byId(ids[index]);
    const picked = answers[q.id];
    const locked = picked !== undefined;
    const ok = picked === q.answer;
    const opts = q.options.map(o => {
      let cls = '', mark = '';
      if (locked) {
        if (o.id === q.answer) { cls = ' correct'; mark = o.id === picked ? 'Your answer · correct' : 'Correct answer'; }
        else if (o.id === picked) { cls = ' wrong'; mark = 'Your answer'; }
        else cls = ' dim';
      }
      return '<button type="button" class="option' + cls + '" data-id="' + o.id + '"' + (locked ? ' disabled' : '') + '><span class="letter">' + o.id + '</span><span class="txt">' + o.html + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</span></button>';
    }).join('');
    const prev = '<button class="secondary" id="prev" type="button"' + (index === 0 ? ' disabled' : '') + '>Previous</button>';
    content.innerHTML =
      '<p class="qcount">QUESTION ' + (index + 1) + ' OF ' + ids.length + ' · ' + q.title + '</p>' +
      (q.certs ? '<p class="certs">' + q.certs + '</p>' : '<p class="certs"></p>') +
      (q.scenario ? '<div class="scenario"><b>Scenario</b>' + q.scenario + '</div>' : '') +
      '<h2 class="prompt" id="prompt" tabindex="-1">' + q.prompt + '</h2>' +
      '<div class="options" role="group" aria-label="Answer options">' + opts + '</div>' +
      (locked
        ? '<div class="feedback' + (ok ? '' : ' incorrect') + '" id="feedback" role="status" tabindex="-1"><h3>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + q.answer + '.') + '</h3><p>' + q.explanation + '</p>' + (q.maps ? '<p class="maps">Maps to: ' + q.maps + '</p>' : '') + '</div>' +
          '<div class="actions">' + prev + '<button class="primary" id="next" type="button">' + (index === ids.length - 1 ? 'See results' : 'Next') + '</button></div>'
        : '<p class="hint">Click an answer to reveal the explanation.</p><div class="actions" style="margin-top:14px">' + prev + '</div>') +
      '<p class="score">Score: ' + s.correct + ' / ' + s.answered + ' correct' + (review ? ' in this review round' : '') + '</p>';
    content.querySelectorAll('.option:not(:disabled)').forEach(b => b.addEventListener('click', () => choose(b.dataset.id)));
    $('prev').addEventListener('click', goPrev);
    if (locked) $('next').addEventListener('click', goNext);
  }

  function choose(id) {
    const q = byId(ids[index]);
    if (done || q.id in answers) return;
    answers[q.id] = id; render('feedback');
    $('next').scrollIntoView({ block: 'nearest' });
  }
  function goNext() {
    const q = byId(ids[index]);
    if (done || !(q.id in answers)) return;
    if (index === ids.length - 1) done = true; else index++;
    window.scrollTo(0, 0); render(done ? 'results' : 'prompt');
  }
  function goPrev() {
    if (done) { done = false; index = ids.length - 1; }
    else if (index > 0) index--;
    else return;
    window.scrollTo(0, 0); render('prompt');
  }

  function renderResults(s) {
    const perfect = s.correct === s.total;
    const pct = s.total ? s.correct / s.total : 0;
    const advice = perfect ? 'Every answer correct. Try explaining each idea aloud in interview form.'
      : pct < 0.6 ? 'Below 60%: re-read the plan\'s Resources and Theory sections, then retry before moving on.'
      : 'Open an item below to review the reasoning, or retry only the ones you missed.';
    content.innerHTML = '<p class="qcount">' + (review ? 'REVIEW COMPLETE' : 'QUIZ COMPLETE') + '</p>' +
      '<h2 id="results" tabindex="-1">' + (perfect ? 'All clear.' : 'A few ideas to revisit.') + '</h2>' +
      '<div class="big">' + s.correct + ' / ' + s.total + '</div><p>' + advice + '</p>' +
      '<div class="actions" style="margin:20px 0 26px"><button class="secondary" id="prev" type="button">Previous</button>' +
      (s.missed.length ? '<button class="primary" id="retry" type="button">Retry missed (' + s.missed.length + ')</button>' : '') +
      '<button class="plain" id="again" type="button">Restart all ' + Q.length + '</button></div><h3>Answer review</h3>' +
      ids.map((id, i) => {
        const q = byId(id), mine = answers[id], ok = mine === q.answer;
        const txt = oid => q.options.find(o => o.id === oid).html;
        return '<details class="review"><summary><span class="st' + (ok ? '' : ' missed') + '">' + (ok ? 'Correct' : 'Missed') + '</span><span>' + (i + 1) + '. ' + q.title + '</span></summary>' +
          '<p>' + q.prompt + '</p><p><strong>Your answer: ' + mine + '.</strong> ' + txt(mine) + '</p>' +
          (ok ? '' : '<p><strong>Correct answer: ' + q.answer + '.</strong> ' + txt(q.answer) + '</p>') +
          '<p>' + q.explanation + '</p></details>';
      }).join('');
    $('prev').addEventListener('click', goPrev);
    $('again').addEventListener('click', () => start(Q.map(q => q.id), false));
    const r = $('retry'); if (r) r.addEventListener('click', () => { window.scrollTo(0, 0); start(s.missed, true); });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!done && 'ABCD'.includes(k) && k.length === 1) choose(k);
    else if (e.key === 'ArrowRight') goNext();
    else if (e.key === 'ArrowLeft') goPrev();
  });
  $('restart').addEventListener('click', () => start(Q.map(q => q.id), false));
  start(Q.map(q => q.id), false);
})();
</script>
</body>
</html>
