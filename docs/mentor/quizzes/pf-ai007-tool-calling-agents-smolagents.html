<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PF-AI007 Quiz</title>
<style>
:root{color-scheme:dark;--bg:#1d1d1f;--panel:#111113;--border:#353538;--text:#ececef;--muted:#aaaab4;--purple:#8985ff;--blue:#247cba;--green:#44c79a;--red:#e08188}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;border:1px solid transparent;border-radius:5px;cursor:pointer;padding:9px 19px;line-height:1.5;font-weight:600}
button:disabled{opacity:.42;cursor:default}
button:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
a{color:var(--purple);text-underline-offset:4px}
code{font-family:"Cascadia Code",Consolas,monospace;font-size:.86em;background:#242426;border:1px solid #444448;border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
h1,h2,h3,p{margin-top:0}
.app{max-width:820px;margin:auto;padding:24px 16px 32px;display:flex;flex-direction:column;gap:20px;min-height:100dvh}
.masthead{padding:20px 22px 22px;background:var(--panel);border:1px solid #29292d;border-radius:8px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.crumb a{color:var(--muted)}
.topline{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{margin:0;color:var(--purple);font-size:22px;line-height:1.35}
.count{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
progress{display:block;width:100%;height:8px;appearance:none;border:0;border-radius:20px;overflow:hidden;background:#3a3a3f}
progress::-webkit-progress-bar{background:#3a3a3f}
progress::-webkit-progress-value{background:var(--green);transition:width .2s}
progress::-moz-progress-bar{background:var(--green)}
.quiz{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:28px clamp(18px,4vw,38px)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.plain{color:var(--muted);background:transparent;border-color:#424247;font-size:12px;padding:5px 10px}
.qcount{margin-bottom:4px;font-size:12px;color:var(--purple);font-weight:600;letter-spacing:.06em}
.certs{font-size:12px;color:var(--muted);margin-bottom:16px}
.scenario{padding:13px 16px;background:#202023;border-left:3px solid var(--purple);border-radius:0 5px 5px 0;margin:0 0 18px;font-size:15px;color:#d6d6dc}
.scenario b{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.prompt{font-size:18px;font-weight:500;margin-bottom:18px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#18181b;color:var(--text);border:1px solid #33333a;border-radius:7px;padding:12px 14px;font-weight:400}
.option:not(:disabled):hover{background:#202028;border-color:#5b5795;filter:none}
.option:disabled{opacity:1;cursor:default}
.option .letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2c2c33;font-weight:700;font-size:13px}
.option .txt{flex:1;min-width:0}
.option.correct{background:#162b24;border-color:#3d9c7b}
.option.correct .letter{background:var(--green);color:#092219}
.option.wrong{background:#302022;border-color:#a66470}
.option.wrong .letter{background:var(--red);color:#2a0d10}
.option.dim{opacity:.55}
.mark{display:block;font-size:12px;font-weight:600;margin-top:3px;color:#72e2b9}
.wrong .mark{color:#ffc0c5}
.hint{color:var(--muted);font-size:12px;margin:14px 0 0}
.feedback{background:#e9f8f1;color:#176a52;border-left:4px solid var(--green);padding:15px 18px;border-radius:3px;margin:18px 0 20px;font-size:15px}
.feedback.incorrect{background:#fff0ee;color:#863a42;border-left-color:var(--red)}
.feedback h3{font-size:15px;margin:0 0 6px}
.feedback p{margin:0 0 8px}.feedback p:last-child{margin:0}
.feedback .maps{font-size:12px;opacity:.85}
.feedback code{color:inherit;background:#ffffff80;border-color:#00000020}
.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.primary{background:var(--green);color:#092219}
.secondary{background:#29292e;color:var(--text);border-color:#51515a}
.score{color:var(--muted);font-size:12px;margin-top:20px}
.big{font-size:56px;line-height:1.2;letter-spacing:-.04em;color:var(--green);font-weight:700;margin:12px 0}
.review{border-top:1px solid var(--border);padding:14px 0}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:14px}
.review .st{color:var(--green);font-weight:650;font-size:12px;flex:none}
.review .st.missed{color:#efa4ac}
.review p{font-size:14px;margin:10px 0 0}
.foot{color:#91919d;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:#aaa7e9}
.topics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.topics a{display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px 18px;text-decoration:none;color:var(--text)}
.topics a:hover{border-color:#5b5795}
.topics .id{color:var(--purple);font-weight:650;font-size:13px;margin-right:8px}
.topics .meta{color:var(--muted);font-size:12px;flex:none}
.lede{color:var(--muted);font-size:14px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="crumb"><a href="index.html">AI Learning quizzes</a> · PF-AI007</div>
    <div class="topline"><h1>Chapter 7: First Agent — smolagents (Transaction Categorizer)</h1><span class="count" id="count"></span></div>
    <progress id="progress" value="0" max="1" aria-label="Questions answered"></progress>
  </header>
  <main class="quiz" id="panel">
    <div class="toolbar"><span class="eyebrow" id="round">Knowledge check</span><button class="plain" id="restart" type="button">Restart</button></div>
    <div id="content"></div>
    <noscript><p>Enable JavaScript to take this quiz.</p></noscript>
  </main>
  <footer class="foot"><span>Source: <a href="../../../plans/in-progress/learning/PF-AI007-tool-calling-agents-smolagents-todo.md">PF-AI007-tool-calling-agents-smolagents-todo.md</a></span><span>Keys: A–D answer · → next · ← previous</span></footer>
</div>
<script type="application/json" id="data">[{"id": "q1", "number": 1, "title": "The ReAct loop", "certs": "Databricks · Google Cloud PMLE", "scenario": "You are explaining your smolagents categorizer to an interviewer. They ask: \"What does the agent actually do between receiving the transaction description and returning a category?\"", "prompt": "Which sequence correctly describes the ReAct agent loop?", "options": [{"id": "A", "html": "The LLM generates the final answer in one shot, then optionally calls tools to verify it"}, {"id": "B", "html": "The LLM calls all tools in parallel, aggregates the results, and generates a final answer"}, {"id": "C", "html": "The agent pre-selects the correct tool based on input type, then executes it exactly once"}, {"id": "D", "html": "The LLM observes the current state (input + any prior tool outputs), reasons about the next action, calls a tool, observes the new output, and repeats until it has sufficient evidence to produce a final answer"}], "answer": "D", "explanation": "ReAct (Reason + Act) is an iterative loop: observe → reason → act (call a tool) → observe again → repeat. The LLM does not answer in one shot (A), tools are not called in parallel (B), and the tool choice is decided by the LLM at each iteration based on what it has learned so far — not pre-selected (C).", "maps": "Databricks GenAI Engineer Associate · Agentic AI &amp; Tool Use; Google Cloud PMLE · AI Agents &amp; Reasoning"}, {"id": "q2", "number": 2, "title": "ToolCallingAgent vs CodeAgent", "certs": "Azure AI-102 · Databricks", "scenario": "Your personal-finance AI service exposes <code>/categorize-agent<\/code> to end users. A colleague suggests smolagents' <code>CodeAgent<\/code> because it's more flexible. You reject it.", "prompt": "What is the primary reason to use <code>ToolCallingAgent<\/code> instead of <code>CodeAgent<\/code> in a production web service?", "options": [{"id": "A", "html": "<code>CodeAgent<\/code> generates and executes arbitrary Python code — which can include dangerous system calls; <code>ToolCallingAgent<\/code> constrains the LLM to structured JSON tool calls only, matching the <code>tool_use<\/code> pattern already used in the extraction pipeline"}, {"id": "B", "html": "<code>CodeAgent<\/code> requires GPU access; <code>ToolCallingAgent<\/code> runs on CPU"}, {"id": "C", "html": "<code>ToolCallingAgent<\/code> is faster because it skips the reasoning step"}, {"id": "D", "html": "<code>ToolCallingAgent<\/code> has built-in rate limiting that prevents overuse"}], "answer": "A", "explanation": "<code>CodeAgent<\/code> can generate <code>os.system(&quot;rm -rf /&quot;)<\/code> or arbitrary network calls and execute them — a critical vulnerability in any multi-tenant or internet-facing service. <code>ToolCallingAgent<\/code> limits the LLM's actions to the declared tool list, expressed as JSON. This is the same reason the extraction pipeline uses <code>tool_use<\/code> with explicit schema validation instead of free-text parsing.", "maps": "Azure AI-102 · Responsible AI &amp; Security; Databricks GenAI Engineer Associate · Production AI Security"}, {"id": "q3", "number": 3, "title": "Tool docstring quality", "certs": "Databricks · AWS ML Engineer", "scenario": "Your <code>find_similar_transactions<\/code> tool is being called even when a clear rule match exists. The Langfuse trace shows it firing first, before <code>search_category_rules<\/code>.", "prompt": "What is the most likely cause, and how do you fix it?", "options": [{"id": "A", "html": "The similarity search endpoint is faster — add a timeout to deprioritize it"}, {"id": "B", "html": "<code>ToolCallingAgent<\/code> calls tools in the order they appear in the tools list; reorder them"}, {"id": "C", "html": "The <code>search_category_rules<\/code> docstring doesn't say \"Use this tool FIRST\" — the LLM has no grounding for the intended call order. Fix: add explicit ordering guidance to both tool docstrings"}, {"id": "D", "html": "smolagents caches the tool call order from the previous request — restart the service"}], "answer": "C", "explanation": "The tool docstring IS the schema description the LLM sees when it decides which tool to call. Without explicit ordering guidance, the LLM reasons from description relevance alone. Adding \"Use this tool FIRST\" to <code>search_category_rules<\/code> and \"Use this when rules return No rules matched\" to <code>find_similar_transactions<\/code> steers the agent toward the intended strategy. The LLM does not use list order (B) or caching (D) as selection criteria.", "maps": "Databricks GenAI Engineer Associate · Prompt Engineering for Agents; AWS Certified ML Engineer – Associate · Model optimization"}, {"id": "q4", "number": 4, "title": "Blocking the async event loop", "certs": "Google Cloud PMLE · Azure AI-102", "scenario": "You call <code>agent.run()<\/code> directly inside your FastAPI <code>async def categorize_with_agent()<\/code> endpoint. Under moderate load, <code>/health<\/code> and <code>/search<\/code> start timing out.", "prompt": "Why does this happen, and what is the correct fix?", "options": [{"id": "A", "html": "smolagents is not thread-safe; use a threading lock to serialize calls"}, {"id": "B", "html": "<code>agent.run()<\/code> is synchronous CPU-bound work; calling it inline inside <code>async def<\/code> blocks the FastAPI event loop for the full agent duration, starving all concurrent requests. Fix: <code>await asyncio.to_thread(agent.run, ...)<\/code> to offload it to the thread pool"}, {"id": "C", "html": "The agent is making too many LLM calls; reduce <code>max_steps<\/code> to 1"}, {"id": "D", "html": "FastAPI cannot handle agentic workloads; use a dedicated Celery worker"}], "answer": "B", "explanation": "FastAPI's event loop is single-threaded. A synchronous blocking call inside <code>async def<\/code> holds the loop for its full duration — every other request queues behind it. <code>asyncio.to_thread()<\/code> offloads the sync call to the thread pool, freeing the event loop to handle concurrent requests. This is the same fix applied to FlashRank in Chapter 4 and the same principle as <code>Task.Run()<\/code> in ASP.NET Core for CPU-bound sync work.", "maps": "Google Cloud PMLE · Production deployment patterns; Azure AI-102 · Scalable AI service design"}, {"id": "q5", "number": 5, "title": "OTel hook ordering at startup", "certs": "Databricks · AWS ML Engineer", "scenario": "You call <code>instrument_smolagents()<\/code> at service startup and run 5 transactions via the smoke test. Langfuse shows 5 parent traces but no child spans for individual tool calls.", "prompt": "What is the most likely cause?", "options": [{"id": "A", "html": "<code>instrument_smolagents()<\/code> was called before the OTLP exporter was configured; it registered a hook with no destination, so tool spans are silently dropped"}, {"id": "B", "html": "OTel spans are emitted only for LLM calls, not tool calls — you need a separate manual tracer for tools"}, {"id": "C", "html": "smolagents emits only one parent span per run by design; tool spans require a separate SDK"}, {"id": "D", "html": "The Langfuse dashboard paginates; scroll down to find tool spans under the parent"}], "answer": "A", "explanation": "<code>instrument_smolagents()<\/code> registers the OTel hook at call time, binding to whatever <code>TracerProvider<\/code> is active at that moment. If the OTLP exporter (pointing at Langfuse) is configured <em>after<\/em> this call, the hook fires into a no-op provider — parent traces may appear from a different pre-existing tracer, but tool-call child spans are lost. Fix: ensure <code>OTEL_EXPORTER_OTLP_ENDPOINT<\/code> is set and the provider is initialized <em>before<\/em> <code>instrument_smolagents()<\/code> in the startup sequence.", "maps": "Databricks GenAI Engineer Associate · AI Observability; AWS Certified ML Engineer – Associate · Model monitoring"}, {"id": "q6", "number": 6, "title": "Observability as a competitive signal", "certs": "Databricks · Azure AI-102", "scenario": "An interviewer at an async-first company asks: \"How do you debug a wrong category prediction from your agent?\"", "prompt": "What answer best demonstrates production AI engineering maturity?", "options": [{"id": "A", "html": "\"We add more training examples and retrain the model.\""}, {"id": "B", "html": "\"We increase <code>max_steps<\/code> so the agent has more time to reconsider.\""}, {"id": "C", "html": "\"We check the output in unit tests after each deployment.\""}, {"id": "D", "html": "\"Every agent run produces a Langfuse trace with a child span per tool call — I can see which tools were called, with what arguments, and what they returned for any specific prediction. When a wrong category is reported, I replay the trace to identify which tool produced misleading output and fix it there — either the rule, the similarity data, or the tool docstring.\""}], "answer": "D", "explanation": "\"I can show you the trace\" is the production AI engineering answer. It demonstrates: (1) observability was designed in, not bolted on after a bug; (2) debugging is trace-driven, not guess-driven; (3) agent failures are tool failures — you fix the tool or its data, not the LLM. Unit tests (C) don't cover the reasoning path; more steps (B) don't diagnose the cause; retraining (A) is wrong category entirely for a tool-calling agent.", "maps": "Databricks GenAI Engineer Associate · AI Observability &amp; Debugging; Azure AI-102 · Monitoring AI applications"}]</script>
<script>
(() => {
  const Q = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const content = $('content');
  let ids, index, answers, done, review;

  function start(sel, isReview) { ids = sel; index = 0; answers = {}; done = false; review = isReview; render('prompt'); }
  const byId = id => Q.find(q => q.id === id);
  const stats = () => {
    const answered = ids.filter(id => id in answers);
    const missed = answered.filter(id => answers[id] !== byId(id).answer);
    return { answered: answered.length, correct: answered.length - missed.length, total: ids.length, missed };
  };

  function render(focusId) {
    const s = stats();
    $('count').textContent = s.answered + ' / ' + s.total + (review ? ' reviewed' : ' answered');
    $('progress').max = s.total; $('progress').value = s.answered;
    $('round').textContent = review ? 'Review round · missed questions' : 'Knowledge check · ' + Q.length + ' questions';
    done ? renderResults(s) : renderQuestion(s);
    const el = focusId && $(focusId); if (el) el.focus({ preventScroll: true });
  }

  function renderQuestion(s) {
    const q = byId(ids[index]);
    const picked = answers[q.id];
    const locked = picked !== undefined;
    const ok = picked === q.answer;
    const opts = q.options.map(o => {
      let cls = '', mark = '';
      if (locked) {
        if (o.id === q.answer) { cls = ' correct'; mark = o.id === picked ? 'Your answer · correct' : 'Correct answer'; }
        else if (o.id === picked) { cls = ' wrong'; mark = 'Your answer'; }
        else cls = ' dim';
      }
      return '<button type="button" class="option' + cls + '" data-id="' + o.id + '"' + (locked ? ' disabled' : '') + '><span class="letter">' + o.id + '</span><span class="txt">' + o.html + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</span></button>';
    }).join('');
    const prev = '<button class="secondary" id="prev" type="button"' + (index === 0 ? ' disabled' : '') + '>Previous</button>';
    content.innerHTML =
      '<p class="qcount">QUESTION ' + (index + 1) + ' OF ' + ids.length + ' · ' + q.title + '</p>' +
      (q.certs ? '<p class="certs">' + q.certs + '</p>' : '<p class="certs"></p>') +
      (q.scenario ? '<div class="scenario"><b>Scenario</b>' + q.scenario + '</div>' : '') +
      '<h2 class="prompt" id="prompt" tabindex="-1">' + q.prompt + '</h2>' +
      '<div class="options" role="group" aria-label="Answer options">' + opts + '</div>' +
      (locked
        ? '<div class="feedback' + (ok ? '' : ' incorrect') + '" id="feedback" role="status" tabindex="-1"><h3>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + q.answer + '.') + '</h3><p>' + q.explanation + '</p>' + (q.maps ? '<p class="maps">Maps to: ' + q.maps + '</p>' : '') + '</div>' +
          '<div class="actions">' + prev + '<button class="primary" id="next" type="button">' + (index === ids.length - 1 ? 'See results' : 'Next') + '</button></div>'
        : '<p class="hint">Click an answer to reveal the explanation.</p><div class="actions" style="margin-top:14px">' + prev + '</div>') +
      '<p class="score">Score: ' + s.correct + ' / ' + s.answered + ' correct' + (review ? ' in this review round' : '') + '</p>';
    content.querySelectorAll('.option:not(:disabled)').forEach(b => b.addEventListener('click', () => choose(b.dataset.id)));
    $('prev').addEventListener('click', goPrev);
    if (locked) $('next').addEventListener('click', goNext);
  }

  function choose(id) {
    const q = byId(ids[index]);
    if (done || q.id in answers) return;
    answers[q.id] = id; render('feedback');
    $('next').scrollIntoView({ block: 'nearest' });
  }
  function goNext() {
    const q = byId(ids[index]);
    if (done || !(q.id in answers)) return;
    if (index === ids.length - 1) done = true; else index++;
    window.scrollTo(0, 0); render(done ? 'results' : 'prompt');
  }
  function goPrev() {
    if (done) { done = false; index = ids.length - 1; }
    else if (index > 0) index--;
    else return;
    window.scrollTo(0, 0); render('prompt');
  }

  function renderResults(s) {
    const perfect = s.correct === s.total;
    const pct = s.total ? s.correct / s.total : 0;
    const advice = perfect ? 'Every answer correct. Try explaining each idea aloud in interview form.'
      : pct < 0.6 ? 'Below 60%: re-read the plan\'s Resources and Theory sections, then retry before moving on.'
      : 'Open an item below to review the reasoning, or retry only the ones you missed.';
    content.innerHTML = '<p class="qcount">' + (review ? 'REVIEW COMPLETE' : 'QUIZ COMPLETE') + '</p>' +
      '<h2 id="results" tabindex="-1">' + (perfect ? 'All clear.' : 'A few ideas to revisit.') + '</h2>' +
      '<div class="big">' + s.correct + ' / ' + s.total + '</div><p>' + advice + '</p>' +
      '<div class="actions" style="margin:20px 0 26px"><button class="secondary" id="prev" type="button">Previous</button>' +
      (s.missed.length ? '<button class="primary" id="retry" type="button">Retry missed (' + s.missed.length + ')</button>' : '') +
      '<button class="plain" id="again" type="button">Restart all ' + Q.length + '</button></div><h3>Answer review</h3>' +
      ids.map((id, i) => {
        const q = byId(id), mine = answers[id], ok = mine === q.answer;
        const txt = oid => q.options.find(o => o.id === oid).html;
        return '<details class="review"><summary><span class="st' + (ok ? '' : ' missed') + '">' + (ok ? 'Correct' : 'Missed') + '</span><span>' + (i + 1) + '. ' + q.title + '</span></summary>' +
          '<p>' + q.prompt + '</p><p><strong>Your answer: ' + mine + '.</strong> ' + txt(mine) + '</p>' +
          (ok ? '' : '<p><strong>Correct answer: ' + q.answer + '.</strong> ' + txt(q.answer) + '</p>') +
          '<p>' + q.explanation + '</p></details>';
      }).join('');
    $('prev').addEventListener('click', goPrev);
    $('again').addEventListener('click', () => start(Q.map(q => q.id), false));
    const r = $('retry'); if (r) r.addEventListener('click', () => { window.scrollTo(0, 0); start(s.missed, true); });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!done && 'ABCD'.includes(k) && k.length === 1) choose(k);
    else if (e.key === 'ArrowRight') goNext();
    else if (e.key === 'ArrowLeft') goPrev();
  });
  $('restart').addEventListener('click', () => start(Q.map(q => q.id), false));
  start(Q.map(q => q.id), false);
})();
</script>
</body>
</html>
