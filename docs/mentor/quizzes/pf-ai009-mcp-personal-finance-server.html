<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PF-AI009 Quiz</title>
<style>
:root{color-scheme:dark;--bg:#1d1d1f;--panel:#111113;--border:#353538;--text:#ececef;--muted:#aaaab4;--purple:#8985ff;--blue:#247cba;--green:#44c79a;--red:#e08188}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;border:1px solid transparent;border-radius:5px;cursor:pointer;padding:9px 19px;line-height:1.5;font-weight:600}
button:disabled{opacity:.42;cursor:default}
button:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
a{color:var(--purple);text-underline-offset:4px}
code{font-family:"Cascadia Code",Consolas,monospace;font-size:.86em;background:#242426;border:1px solid #444448;border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
h1,h2,h3,p{margin-top:0}
.app{max-width:820px;margin:auto;padding:24px 16px 32px;display:flex;flex-direction:column;gap:20px;min-height:100dvh}
.masthead{padding:20px 22px 22px;background:var(--panel);border:1px solid #29292d;border-radius:8px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.crumb a{color:var(--muted)}
.topline{display:flex;gap:16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{margin:0;color:var(--purple);font-size:22px;line-height:1.35}
.count{flex-shrink:0;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
progress{display:block;width:100%;height:8px;appearance:none;border:0;border-radius:20px;overflow:hidden;background:#3a3a3f}
progress::-webkit-progress-bar{background:#3a3a3f}
progress::-webkit-progress-value{background:var(--green);transition:width .2s}
progress::-moz-progress-bar{background:var(--green)}
.quiz{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:28px clamp(18px,4vw,38px)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.eyebrow{color:var(--muted);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.plain{color:var(--muted);background:transparent;border-color:#424247;font-size:12px;padding:5px 10px}
.qcount{margin-bottom:4px;font-size:12px;color:var(--purple);font-weight:600;letter-spacing:.06em}
.certs{font-size:12px;color:var(--muted);margin-bottom:16px}
.scenario{padding:13px 16px;background:#202023;border-left:3px solid var(--purple);border-radius:0 5px 5px 0;margin:0 0 18px;font-size:15px;color:#d6d6dc}
.scenario b{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.prompt{font-size:18px;font-weight:500;margin-bottom:18px;line-height:1.55}
.options{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.option{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#18181b;color:var(--text);border:1px solid #33333a;border-radius:7px;padding:12px 14px;font-weight:400}
.option:not(:disabled):hover{background:#202028;border-color:#5b5795;filter:none}
.option:disabled{opacity:1;cursor:default}
.option .letter{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#2c2c33;font-weight:700;font-size:13px}
.option .txt{flex:1;min-width:0}
.option.correct{background:#162b24;border-color:#3d9c7b}
.option.correct .letter{background:var(--green);color:#092219}
.option.wrong{background:#302022;border-color:#a66470}
.option.wrong .letter{background:var(--red);color:#2a0d10}
.option.dim{opacity:.55}
.mark{display:block;font-size:12px;font-weight:600;margin-top:3px;color:#72e2b9}
.wrong .mark{color:#ffc0c5}
.hint{color:var(--muted);font-size:12px;margin:14px 0 0}
.feedback{background:#e9f8f1;color:#176a52;border-left:4px solid var(--green);padding:15px 18px;border-radius:3px;margin:18px 0 20px;font-size:15px}
.feedback.incorrect{background:#fff0ee;color:#863a42;border-left-color:var(--red)}
.feedback h3{font-size:15px;margin:0 0 6px}
.feedback p{margin:0 0 8px}.feedback p:last-child{margin:0}
.feedback .maps{font-size:12px;opacity:.85}
.feedback code{color:inherit;background:#ffffff80;border-color:#00000020}
.actions{display:flex;gap:11px;flex-wrap:wrap;align-items:center}
.primary{background:var(--green);color:#092219}
.secondary{background:#29292e;color:var(--text);border-color:#51515a}
.score{color:var(--muted);font-size:12px;margin-top:20px}
.big{font-size:56px;line-height:1.2;letter-spacing:-.04em;color:var(--green);font-weight:700;margin:12px 0}
.review{border-top:1px solid var(--border);padding:14px 0}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:14px}
.review .st{color:var(--green);font-weight:650;font-size:12px;flex:none}
.review .st.missed{color:#efa4ac}
.review p{font-size:14px;margin:10px 0 0}
.foot{color:#91919d;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:#aaa7e9}
.topics{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.topics a{display:flex;justify-content:space-between;gap:16px;align-items:baseline;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:15px 18px;text-decoration:none;color:var(--text)}
.topics a:hover{border-color:#5b5795}
.topics .id{color:var(--purple);font-weight:650;font-size:13px;margin-right:8px}
.topics .meta{color:var(--muted);font-size:12px;flex:none}
.lede{color:var(--muted);font-size:14px;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <div class="crumb"><a href="index.html">AI Learning quizzes</a> · PF-AI009</div>
    <div class="topline"><h1>Model Context Protocol (MCP) Server</h1><span class="count" id="count"></span></div>
    <progress id="progress" value="0" max="1" aria-label="Questions answered"></progress>
  </header>
  <main class="quiz" id="panel">
    <div class="toolbar"><span class="eyebrow" id="round">Knowledge check</span><button class="plain" id="restart" type="button">Restart</button></div>
    <div id="content"></div>
    <noscript><p>Enable JavaScript to take this quiz.</p></noscript>
  </main>
  <footer class="foot"><span>Source: <a href="../../../plans/done/learning/PF-AI009-mcp-personal-finance-server-todo.md">PF-AI009-mcp-personal-finance-server-todo.md</a></span><span>Keys: A–D answer · → next · ← previous</span></footer>
</div>
<script type="application/json" id="data">[{"id": "q1", "number": 1, "title": "MCP primitives — when to use which", "certs": "Databricks · Azure AI-102", "scenario": "You're extending the personal-finance MCP server. You want to: (a) let the AI query account balances on demand, (b) give the AI read access to a static lookup table of Indonesian bank codes, (c) offer a pre-built prompt template for \"summarize my month in plain Bahasa.\"", "prompt": "Which MCP primitive maps to each use case?", "options": [{"id": "A", "html": "(a) Resource, (b) Tool, (c) Prompt — Resources are for dynamic data; Tools are for static lookups"}, {"id": "B", "html": "(a) Prompt, (b) Resource, (c) Tool — Prompts trigger actions; Resources store data; Tools generate text"}, {"id": "C", "html": "(a) Tool, (b) Resource, (c) Prompt — Tools for callable actions, Resources for data the AI reads, Prompts for reusable templates"}, {"id": "D", "html": "All three are Tools — MCP doesn't distinguish between callable actions and read-only data"}], "answer": "C", "explanation": "The MCP spec defines three primitives for three purposes: Tools (callable actions that return results — queries, writes, computations), Resources (URI-addressed data the AI reads passively — files, static tables, configs), Prompts (reusable templates with variables the AI fills in). Account balance query = Tool (live, dynamic); bank code table = Resource (static read); month summary template = Prompt.", "maps": "Databricks GenAI Engineer Associate · Application Development (tool/agent design); Azure AI-102 · Implement AI agents"}, {"id": "q2", "number": 2, "title": "SSE vs stdio transport — shared state tradeoff", "certs": "Databricks · AWS ML Engineer", "scenario": "Your MCP server shares the AI service's asyncpg connection pool and <code>RetrievalService<\/code>. A colleague suggests running it as a stdio server (spawned by Claude Desktop as a subprocess).", "prompt": "What is the main operational problem with stdio transport in this case?", "options": [{"id": "A", "html": "Claude Desktop spawns a new process on every connection — each process creates a new asyncpg pool, losing connection reuse and the warm <code>RetrievalService<\/code> embedding cache that the AI service running on port 8000 maintains. SSE connects to the already-running process."}, {"id": "B", "html": "stdio servers cannot make outbound HTTP calls (e.g., to the .NET API)"}, {"id": "C", "html": "stdio transport limits tool return payloads to 4KB"}, {"id": "D", "html": "stdio transport is not supported by the MCP spec for Python servers"}], "answer": "A", "explanation": "Stdio spawns a fresh process per session; a new asyncpg pool means no connection reuse and a cold <code>RetrievalService<\/code> (no warm embedding cache). SSE connects to the running AI service, which already has a warm pool and shared state. The trade-off: SSE requires the service to be running; stdio is self-contained but stateless and pool-hungry.", "maps": "Databricks GenAI Engineer Associate · Application Development (deployment); AWS Certified ML Engineer – Associate · ML infrastructure / cost"}, {"id": "q3", "number": 3, "title": "Tool schema typing — why it matters", "certs": "Azure AI-102 · Databricks", "scenario": "Your <code>get_transactions<\/code> tool returns <code>list[dict]<\/code> instead of a typed structure. In Claude Desktop, the AI occasionally confuses field names and generates incorrect follow-up tool calls.", "prompt": "Why does the return type annotation matter for MCP tool reliability?", "options": [{"id": "A", "html": "FastMCP requires typed returns — <code>dict<\/code> causes a schema generation error at server startup"}, {"id": "B", "html": "Typed returns add latency because FastMCP validates them against the schema on every call"}, {"id": "C", "html": "Claude's tool-use API only accepts typed returns; <code>dict<\/code> causes a server-side error"}, {"id": "D", "html": "The MCP client sends the tool's JSON schema to the AI as part of the tool definition. <code>dict<\/code> generates an opaque schema <code>{}<\/code> that describes no fields — the AI must guess. Typed returns (explicit <code>list[dict[str, ...]]<\/code> with a docstring listing fields, or TypedDict) generate named fields that the AI uses to generate accurate follow-up calls and format output correctly."}], "answer": "D", "explanation": "The JSON schema exposed by the MCP server is the AI client's only signal about what a tool returns. <code>dict<\/code> produces <code>{}<\/code> — no fields, no types. An explicit type (or a thorough docstring of the returned fields) produces a schema with named keys and types, which the AI uses to generate correct parameter selection in follow-up calls and to display structured data. The reliability difference is measurable in practice.", "maps": "Azure AI-102 · Implement AI agents (tool design); Databricks GenAI Engineer Associate · Application Development (schema design)"}, {"id": "q4", "number": 4, "title": "SQL pre-filtering in MCP tool queries", "certs": "Databricks · AWS ML Engineer", "scenario": "The AI calls <code>get_transactions(category=&quot;Food&quot;, limit=10)<\/code>. Your implementation retrieves all rows, then filters and slices in Python. A colleague says \"Python slicing is fine.\"", "prompt": "What is the core problem with this approach?", "options": [{"id": "A", "html": "Python list slicing is slower than SQL LIMIT at any scale"}, {"id": "B", "html": "Retrieving all rows then slicing means <code>limit<\/code> is silently ignored whenever category-filtered rows in the DB are fewer than the unfiltered fetch count, potentially returning more (or all) matching rows. More importantly, it reads unnecessary rows over the network. SQL <code>WHERE<\/code> + <code>LIMIT<\/code> pushes both filtering and capping into the query planner, where indexes are available."}, {"id": "C", "html": "SQL <code>LIMIT<\/code> is required by the MCP spec for all tool implementations"}, {"id": "D", "html": "Python-side filtering cannot use ILIKE semantics"}], "answer": "B", "explanation": "SQL <code>WHERE category ILIKE ... LIMIT n<\/code> filters and caps at the query level; Python slicing after a full fetch is wasteful and produces unpredictable result sizes. This is the same pre-filter vs post-filter reasoning as PF-AI004's metadata filtering: push constraints into SQL where the indexes are. For a corpus of thousands of transactions, the difference in network bytes transferred is significant even at dev scale.", "maps": "Databricks GenAI Engineer Associate · Data Preparation (efficient retrieval); AWS Certified ML Engineer – Associate · ML infrastructure"}, {"id": "q5", "number": 5, "title": "Calling .NET API vs querying Supabase directly", "certs": "Azure AI-102 · Google Cloud PMLE", "scenario": "<code>get_pyramid_scores()<\/code> could either (a) query the <code>journey_scores<\/code> Supabase table directly via asyncpg, or (b) call <code>GET /api/journey/scores<\/code> on the .NET API via httpx.", "prompt": "Why is option (b) the architecturally correct choice?", "options": [{"id": "A", "html": "asyncpg cannot query computed columns; the .NET API pre-computes them"}, {"id": "B", "html": "Supabase RLS blocks asyncpg connections from Python"}, {"id": "C", "html": "<code>JourneyScoringService<\/code> computes tier scores from transactions, assets, and investments using business logic spread across MediatR handlers. Duplicating that computation in Python creates a maintenance split: change the scoring formula once, forget to update the Python copy. The HTTP call is a deliberate boundary — Python owns embeddings and MCP tooling; .NET owns scoring logic. The 10ms overhead is negligible in a chat interaction."}, {"id": "D", "html": "The MCP spec requires all tool data to come from REST APIs"}], "answer": "C", "explanation": "The boundary reflects ownership. The .NET API owns the <code>JourneyScoringService<\/code> business logic (multi-source aggregation, tier threshold rules). Duplicating it in Python creates drift — exactly the THINK-05 \"both sides must update\" problem, extended to business logic. The httpx call makes the boundary explicit and keeps the source of truth in one place, at negligible latency cost for an interactive chat tool.", "maps": "Azure AI-102 · Design AI solutions (integration patterns); Google Cloud PMLE · MLOps / data governance"}, {"id": "q6", "number": 6, "title": "Multi-agent MCP — single responsibility", "certs": "Databricks · AWS ML Engineer", "scenario": "You build a 2-agent system: an Analyst that calls MCP tools to gather data, and an Advisor that generates recommendations. A colleague asks: \"Why doesn't the Advisor call the MCP tools directly to verify the data itself?\"", "prompt": "Why is giving the Advisor direct MCP tool access an anti-pattern here?", "options": [{"id": "A", "html": "The Advisor receives a structured report from the Analyst — it doesn't need live data access because the Analyst already fetched and formatted it. Giving both agents MCP access doubles tool calls and latency, forces the Advisor to understand the financial data schema, and muddies the agent's single responsibility (synthesis, not retrieval). The \"report hand-off\" pattern keeps data gathering and synthesis cleanly separated."}, {"id": "B", "html": "FastMCP does not support concurrent connections from multiple agents"}, {"id": "C", "html": "Only Claude Desktop is permitted to call MCP servers; other agents must use the REST API"}, {"id": "D", "html": "The MCP protocol only allows one agent per server connection"}], "answer": "A", "explanation": "Single responsibility applied to agents: the Analyst handles tool calls (data access); the Advisor handles synthesis (reasoning over the report). Giving both MCP access doubles retrieval calls, adds latency at every synthesis step, and couples the Advisor to the data schema. The hand-off pattern (Analyst produces structured report → Advisor receives it as a text message) is the building block of every multi-agent pipeline — and the answer to \"how do you design a system that needs multiple AI capabilities?\"", "maps": "Databricks GenAI Engineer Associate · Application Development (multi-agent design); AWS Certified ML Engineer – Associate · Model deployment"}]</script>
<script>
(() => {
  const Q = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const content = $('content');
  let ids, index, answers, done, review;

  function start(sel, isReview) { ids = sel; index = 0; answers = {}; done = false; review = isReview; render('prompt'); }
  const byId = id => Q.find(q => q.id === id);
  const stats = () => {
    const answered = ids.filter(id => id in answers);
    const missed = answered.filter(id => answers[id] !== byId(id).answer);
    return { answered: answered.length, correct: answered.length - missed.length, total: ids.length, missed };
  };

  function render(focusId) {
    const s = stats();
    $('count').textContent = s.answered + ' / ' + s.total + (review ? ' reviewed' : ' answered');
    $('progress').max = s.total; $('progress').value = s.answered;
    $('round').textContent = review ? 'Review round · missed questions' : 'Knowledge check · ' + Q.length + ' questions';
    done ? renderResults(s) : renderQuestion(s);
    const el = focusId && $(focusId); if (el) el.focus({ preventScroll: true });
  }

  function renderQuestion(s) {
    const q = byId(ids[index]);
    const picked = answers[q.id];
    const locked = picked !== undefined;
    const ok = picked === q.answer;
    const opts = q.options.map(o => {
      let cls = '', mark = '';
      if (locked) {
        if (o.id === q.answer) { cls = ' correct'; mark = o.id === picked ? 'Your answer · correct' : 'Correct answer'; }
        else if (o.id === picked) { cls = ' wrong'; mark = 'Your answer'; }
        else cls = ' dim';
      }
      return '<button type="button" class="option' + cls + '" data-id="' + o.id + '"' + (locked ? ' disabled' : '') + '><span class="letter">' + o.id + '</span><span class="txt">' + o.html + (mark ? '<span class="mark">' + mark + '</span>' : '') + '</span></button>';
    }).join('');
    const prev = '<button class="secondary" id="prev" type="button"' + (index === 0 ? ' disabled' : '') + '>Previous</button>';
    content.innerHTML =
      '<p class="qcount">QUESTION ' + (index + 1) + ' OF ' + ids.length + ' · ' + q.title + '</p>' +
      (q.certs ? '<p class="certs">' + q.certs + '</p>' : '<p class="certs"></p>') +
      (q.scenario ? '<div class="scenario"><b>Scenario</b>' + q.scenario + '</div>' : '') +
      '<h2 class="prompt" id="prompt" tabindex="-1">' + q.prompt + '</h2>' +
      '<div class="options" role="group" aria-label="Answer options">' + opts + '</div>' +
      (locked
        ? '<div class="feedback' + (ok ? '' : ' incorrect') + '" id="feedback" role="status" tabindex="-1"><h3>' + (ok ? 'Correct.' : 'Not quite. The answer is ' + q.answer + '.') + '</h3><p>' + q.explanation + '</p>' + (q.maps ? '<p class="maps">Maps to: ' + q.maps + '</p>' : '') + '</div>' +
          '<div class="actions">' + prev + '<button class="primary" id="next" type="button">' + (index === ids.length - 1 ? 'See results' : 'Next') + '</button></div>'
        : '<p class="hint">Click an answer to reveal the explanation.</p><div class="actions" style="margin-top:14px">' + prev + '</div>') +
      '<p class="score">Score: ' + s.correct + ' / ' + s.answered + ' correct' + (review ? ' in this review round' : '') + '</p>';
    content.querySelectorAll('.option:not(:disabled)').forEach(b => b.addEventListener('click', () => choose(b.dataset.id)));
    $('prev').addEventListener('click', goPrev);
    if (locked) $('next').addEventListener('click', goNext);
  }

  function choose(id) {
    const q = byId(ids[index]);
    if (done || q.id in answers) return;
    answers[q.id] = id; render('feedback');
    $('next').scrollIntoView({ block: 'nearest' });
  }
  function goNext() {
    const q = byId(ids[index]);
    if (done || !(q.id in answers)) return;
    if (index === ids.length - 1) done = true; else index++;
    window.scrollTo(0, 0); render(done ? 'results' : 'prompt');
  }
  function goPrev() {
    if (done) { done = false; index = ids.length - 1; }
    else if (index > 0) index--;
    else return;
    window.scrollTo(0, 0); render('prompt');
  }

  function renderResults(s) {
    const perfect = s.correct === s.total;
    const pct = s.total ? s.correct / s.total : 0;
    const advice = perfect ? 'Every answer correct. Try explaining each idea aloud in interview form.'
      : pct < 0.6 ? 'Below 60%: re-read the plan\'s Resources and Theory sections, then retry before moving on.'
      : 'Open an item below to review the reasoning, or retry only the ones you missed.';
    content.innerHTML = '<p class="qcount">' + (review ? 'REVIEW COMPLETE' : 'QUIZ COMPLETE') + '</p>' +
      '<h2 id="results" tabindex="-1">' + (perfect ? 'All clear.' : 'A few ideas to revisit.') + '</h2>' +
      '<div class="big">' + s.correct + ' / ' + s.total + '</div><p>' + advice + '</p>' +
      '<div class="actions" style="margin:20px 0 26px"><button class="secondary" id="prev" type="button">Previous</button>' +
      (s.missed.length ? '<button class="primary" id="retry" type="button">Retry missed (' + s.missed.length + ')</button>' : '') +
      '<button class="plain" id="again" type="button">Restart all ' + Q.length + '</button></div><h3>Answer review</h3>' +
      ids.map((id, i) => {
        const q = byId(id), mine = answers[id], ok = mine === q.answer;
        const txt = oid => q.options.find(o => o.id === oid).html;
        return '<details class="review"><summary><span class="st' + (ok ? '' : ' missed') + '">' + (ok ? 'Correct' : 'Missed') + '</span><span>' + (i + 1) + '. ' + q.title + '</span></summary>' +
          '<p>' + q.prompt + '</p><p><strong>Your answer: ' + mine + '.</strong> ' + txt(mine) + '</p>' +
          (ok ? '' : '<p><strong>Correct answer: ' + q.answer + '.</strong> ' + txt(q.answer) + '</p>') +
          '<p>' + q.explanation + '</p></details>';
      }).join('');
    $('prev').addEventListener('click', goPrev);
    $('again').addEventListener('click', () => start(Q.map(q => q.id), false));
    const r = $('retry'); if (r) r.addEventListener('click', () => { window.scrollTo(0, 0); start(s.missed, true); });
  }

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toUpperCase();
    if (!done && 'ABCD'.includes(k) && k.length === 1) choose(k);
    else if (e.key === 'ArrowRight') goNext();
    else if (e.key === 'ArrowLeft') goPrev();
  });
  $('restart').addEventListener('click', () => start(Q.map(q => q.id), false));
  start(Q.map(q => q.id), false);
})();
</script>
</body>
