<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Personal Finance — Journey & Cashflow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Lucide icons (UMD) -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <!-- Tailwind Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: { DEFAULT: 'hsl(var(--primary))', foreground: 'hsl(var(--primary-foreground))' },
            secondary: { DEFAULT: 'hsl(var(--secondary))', foreground: 'hsl(var(--secondary-foreground))' },
            muted: { DEFAULT: 'hsl(var(--muted))', foreground: 'hsl(var(--muted-foreground))' },
            accent: { DEFAULT: 'hsl(var(--accent-foreground) / 0.1)', foreground: 'hsl(var(--accent-foreground))' },
            destructive: { DEFAULT: 'hsl(var(--destructive))', foreground: 'hsl(var(--destructive-foreground))' },
            card: { DEFAULT: 'hsl(var(--card))', foreground: 'hsl(var(--card-foreground))' },
            popover: { DEFAULT: 'hsl(var(--popover))', foreground: 'hsl(var(--popover-foreground))' },
            sidebar: {
              DEFAULT: 'hsl(var(--sidebar-background))',
              foreground: 'hsl(var(--sidebar-foreground))',
              border: 'hsl(var(--sidebar-border))',
              accent: 'hsl(var(--sidebar-accent))',
            },
            success: 'hsl(var(--success))',
            income: 'hsl(var(--income))',
            expense: 'hsl(var(--expense))',
            warning: 'hsl(var(--warning))',
            info: 'hsl(var(--info))',
          },
        },
      },
    };
  </script>

  <style>
    /* ── Light mode (zen canvas) — default ───────────────────────── */
    :root {
      color-scheme: light;
      --background: 42 17% 94%;
      --foreground: 35 9% 19%;
      --card: 0 0% 100%;
      --card-foreground: 35 9% 19%;
      --popover: 36 17% 97%;
      --popover-foreground: 35 9% 19%;
      --primary: 35 9% 19%;
      --primary-foreground: 0 0% 100%;
      --secondary: 39 18% 91%;
      --secondary-foreground: 35 9% 19%;
      --muted: 39 18% 91%;
      --muted-foreground: 0 0% 42%;
      --accent-foreground: 35 9% 19%;
      --destructive: 354 91% 65%;
      --destructive-foreground: 0 0% 100%;
      --border: 39 18% 88%;
      --input: 39 18% 91%;
      --ring: 35 9% 19%;
      --radius: 12px;
      --sidebar-background: 42 17% 91%;
      --sidebar-foreground: 0 0% 42%;
      --sidebar-border: 39 18% 85%;
      --sidebar-accent: 39 18% 88%;
      --success: 170 90% 32%;
      --income: 158 64% 52%;
      --expense: 354 70% 54%;
      --warning: 35 91% 50%;
      --info: 220 91% 55%;
      --font-title: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    }

    /* ── Dark mode (Toloshi) ─────────────────────────────────────── */
    .dark {
      color-scheme: dark;
      --background: 240 10% 3%;
      --foreground: 0 0% 98%;
      --card: 240 6% 8%;
      --card-foreground: 210 12% 90%;
      --popover: 240 6% 10%;
      --popover-foreground: 210 12% 90%;
      --primary: 220 91% 65%;
      --primary-foreground: 0 0% 100%;
      --secondary: 240 6% 12%;
      --secondary-foreground: 0 0% 100%;
      --muted: 240 6% 10%;
      --muted-foreground: 210 8% 50%;
      --accent-foreground: 220 91% 65%;
      --destructive: 354 91% 65%;
      --destructive-foreground: 0 0% 100%;
      --border: 240 6% 12%;
      --input: 240 6% 10%;
      --ring: 220 91% 65%;
      --sidebar-background: 240 10% 3%;
      --sidebar-foreground: 210 8% 55%;
      --sidebar-border: 240 6% 10%;
      --sidebar-accent: 240 6% 8%;
      --success: 170 90% 32%;
      --income: 158 64% 52%;
      --expense: 0 91% 71%;
      --warning: 35 91% 60%;
      --info: 220 91% 65%;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-feature-settings: 'ss01', 'cv11', 'tnum';
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root { height: 100vh; }

    .pf-card {
      background: hsl(var(--card));
      color: hsl(var(--card-foreground));
      border: 1px solid hsl(var(--border));
      border-radius: var(--radius);
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.04);
    }

    .font-mono {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif !important;
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum';
    }
    .font-data {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-variant-numeric: tabular-nums;
    }

    .zen-canvas {
      background-color: hsl(var(--background));
      background-image:
        linear-gradient(rgba(0,0,0,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.018) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    .dark .zen-canvas {
      background-image:
        linear-gradient(rgba(255,255,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.012) 1px, transparent 1px);
    }

    .grow-bar { transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
    .pop-in { animation: popIn 0.45s cubic-bezier(0.16,1,0.3,1); }
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.65) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ─ Reward loop (toast + garden widget feedback) ─ */
    .rw-toast { animation: rwToastIn 300ms cubic-bezier(0.16,1,0.3,1); }
    @keyframes rwToastIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .rw-pulse { display: inline-block; animation: rwPulse 650ms cubic-bezier(0.16,1,0.3,1); }
    @keyframes rwPulse {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    .rw-float-gain {
      position: absolute; top: -2px; right: 10px;
      font-size: 11px; font-weight: 600; pointer-events: none;
      animation: rwFloat 1.35s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes rwFloat {
      0%   { opacity: 0; transform: translateY(4px); }
      20%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-20px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rw-toast, .rw-pulse, .rw-float-gain, .pop-in { animation: none; }
      .grow-bar { transition: none; }
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: hsl(var(--foreground) / 0.1); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: hsl(var(--foreground) / 0.2); }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="pf-data.js"></script>
  <script type="text/babel" src="pf-icons.jsx"></script>
  <script type="text/babel" src="pf-reward.jsx"></script>
  <script type="text/babel" src="pf-journey.jsx"></script>
  <script type="text/babel" src="pf-cashflow.jsx"></script>
  <script type="text/babel" src="pf-chat.jsx"></script>
  <script type="text/babel" src="pf-app.jsx"></script>
</body>
</html>
